<div class="loader-container" *ngIf="isLoading()" [@loaderState]="loaderState">
  <div class="loader-content" [@glowEffect]="glowState">
    <div class="logo-container">
      <img src="assets/logo.png" alt="CRAWLERS Logo" class="logo-img">
      <div class="loading-text">CRAWLERS</div>
    </div>
    <div class="loading-bar">
      <div class="bar-progress"></div>
    </div>
  </div>
</div>
